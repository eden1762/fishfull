    <meta property="og:type" content="website" />

    <meta property="og:title" content="FishFull 零失敗魚料理｜清蒸、乾煎、味噌魚湯" />
    <meta property="og:description" content="買魚前先選一道菜：短步驟、清楚時間與失敗救援，第一次料理整尾魚也不慌。" />

    <meta property="og:image" content="https://fishfull.vercel.app/fishfull.jpg" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "FishFull 零失敗魚料理",
        "url": "https://fishfull.vercel.app/recipes",
        "description": "午仔魚清蒸、乾煎與味噌魚湯等容易上手的家常魚料理。",
        "isPartOf": { "@type": "WebSite", "name": "FishFull 漁有料", "url": "https://fishfull.vercel.app/" },
        "inLanguage": ["zh-Hant", "en"]
      }
    </script>
    <link rel="stylesheet" href="/pages/site-pages.css" />
    <link rel="stylesheet" href="/pages/action-pages.css" />
    <link rel="stylesheet" href="/fishfull-brand.css" />
    <style>
      .recipe-card__media {
        margin: 0 0 16px;
        overflow: hidden;
        border-radius: 18px;
        background: #eef8f6;
      }

      .recipe-card__image {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
      }
    </style>
  </head>
  <body data-page="recipes">
    <div id="root"></div>
    <script src="/site-i18n.js" defer></script>
    <script src="/pages/pages.js" defer></script>
    <script src="/fishfull-site-shell.js" defer></script>
    <script>
      (function () {
        'use strict';

        var recipeImages = [
          {
            src: '/assets/cuisine/蔥薑清蒸午仔魚.png',
            alt: '蔥薑清蒸午仔魚料理成品'
          },
          {
            src: '/assets/cuisine/鹽香乾煎午仔魚.png',
            alt: '鹽香乾煎午仔魚料理成品'
          },
          {
            src: '/assets/cuisine/味噌魚湯.png',
            alt: '味噌魚湯料理成品'
          }
        ];
        var timer = 0;

        function attachRecipeImages() {
          var cards = document.querySelectorAll('.recipe-card');
          Array.prototype.forEach.call(cards, function (card, index) {
            var imageData = recipeImages[index];
            if (!imageData || card.querySelector('.recipe-card__media')) return;

            var figure = document.createElement('figure');
            figure.className = 'recipe-card__media';

            var image = document.createElement('img');
            image.className = 'recipe-card__image';
            image.src = imageData.src;
            image.alt = imageData.alt;
            image.decoding = 'async';
            image.loading = index === 0 ? 'eager' : 'lazy';

            figure.appendChild(image);
            card.insertBefore(figure, card.firstChild);
          });
        }

        function scheduleAttach() {
          window.clearTimeout(timer);
          timer = window.setTimeout(attachRecipeImages, 16);
        }

        document.addEventListener('DOMContentLoaded', function () {
          attachRecipeImages();
          var root = document.getElementById('root');
          if (root && window.MutationObserver) {
            new MutationObserver(scheduleAttach).observe(root, {
              childList: true,
              subtree: true
            });
          }
        });
      })();
    </script>
  </body>
</html>
